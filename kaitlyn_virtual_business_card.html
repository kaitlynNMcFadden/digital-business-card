<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Kaitlyn McFadden | Digital Business Card</title>
<meta name="theme-color" content="#222925" />
<style>
  :root {
    --bg: #eef0ea;
    --ink: #222925;
    --sage: #5b6f62;
    --sage-light: #aeb8a6;
    --card-radius: 22px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100svh;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
      radial-gradient(circle at top, rgba(174,184,166,.35), transparent 34%),
      var(--bg);
    color: var(--ink);
    display: grid;
    place-items: center;
    padding: 24px 16px;
  }

  .wrap {
    width: min(94vw, 760px);
    text-align: center;
  }

  h1 {
    margin: 0 0 6px;
    font-size: clamp(1.45rem, 4vw, 2.1rem);
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .hint {
    margin: 0 0 18px;
    color: #5f665f;
    font-size: .95rem;
  }

  .scene {
    width: 100%;
    aspect-ratio: 1050 / 600;
    perspective: 1400px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .card {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform .72s cubic-bezier(.2,.72,.2,1);
  }

  .card.flipped {
    transform: rotateY(180deg);
  }

  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: var(--card-radius);
    overflow: hidden;
    box-shadow:
      0 18px 50px rgba(34,41,37,.18),
      0 2px 10px rgba(34,41,37,.10);
    background: white;
  }

  .face.back {
    transform: rotateY(180deg);
  }

  .face img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .actions {
    margin-top: 20px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }

  .actions a,
  .flip-button {
    appearance: none;
    border: 0;
    text-decoration: none;
    color: white;
    background: var(--ink);
    font: inherit;
    font-weight: 650;
    padding: 11px 16px;
    border-radius: 999px;
    box-shadow: 0 5px 16px rgba(34,41,37,.13);
    cursor: pointer;
  }

  .actions a:hover,
  .flip-button:hover {
    background: var(--sage);
  }

  .flip-button {
    background: var(--sage);
  }

  .flip-button:hover {
    background: var(--ink);
  }

  .small {
    margin-top: 14px;
    font-size: .8rem;
    color: #70766f;
  }

  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
  }
</style>
</head>
